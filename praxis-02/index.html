<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="description" content="Praxis 02 - Evaluador de notas con JavaScript (0 a 20).">

<body>

    <h1>Evaluador de Notas</h1>

    <label for="inputNota">Ingresa tu nota (0 a 20):</label>

    <button type="button" id="btnEvaluar">Evaluar</button>

    <div id="mensajeResultado"></div>

    <script src="script.js"></script>
